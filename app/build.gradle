plugins {
    alias(libs.plugins.android.application)
    // ADICIONE ESTA LINHA AQUI:
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.SGDDA'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.SGDDA"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // Adicione esta linha se o Android Studio reclamar do "main" nos XMLs
    // (Pode não ser necessário, mas é uma boa prática)
    buildFeatures {
        viewBinding false // Mantém como false, já que estamos usando findViewById
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Dependências do Firebase que já tínhamos adicionado
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // NOVA DEPENDÊNCIA DO GRÁFICO
    implementation libs.mpandroidchart
}


